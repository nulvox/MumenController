name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - cleanup

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lets zizmor inspect workflow/action metadata during online audits
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  rust:
    name: Test core and build Teensy 4.0 + Pro Micro firmwares
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install AVR GCC toolchain and Rust targets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr
          rustup target add thumbv7em-none-eabihf
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test portable core
        run: cargo test -p mumen-core --target x86_64-unknown-linux-gnu

      - name: Build Teensy 4.0 firmware (all layout features)
        run: |
          for layout in layout-standard layout-alternate layout-d16 layout-d16s layout-a4d17; do
            cargo build --release -p firmware-teensy40 --target thumbv7em-none-eabihf --no-default-features --features "$layout"
          done

      - name: Build ATmega32U4 Pro Micro firmware (all layout features)
        working-directory: crates/firmware-promicro
        run: |
          for layout in layout-promicro-standard layout-promicro-classic; do
            cargo +nightly build --release --no-default-features --features "$layout"
          done
