name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - cleanup
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lets zizmor inspect workflow/action metadata during online audits
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  rust:
    name: Test core and build Teensy 4.0 + Pro Micro firmwares
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install AVR GCC, ARM binutils, and Rust targets
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr binutils-arm-none-eabi
          rustup target add thumbv7em-none-eabihf
          rustup toolchain install nightly --profile minimal --component rust-src

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test portable core
        run: cargo test -p mumen-core --target x86_64-unknown-linux-gnu

      - name: Build Teensy 4.0 firmware (all layout features) and package .hex blobs
        run: |
          mkdir -p dist
          for layout in layout-standard layout-alternate layout-d16 layout-d16s layout-a4d17; do
            cargo build --release -p firmware-teensy40 --target thumbv7em-none-eabihf --no-default-features --features "$layout"
            arm-none-eabi-objcopy -O ihex \
              target/thumbv7em-none-eabihf/release/firmware-teensy40 \
              "dist/mumen-teensy40-${layout}.hex"
          done

      - name: Build ATmega32U4 Pro Micro firmware (all layout features) and package .hex blobs
        working-directory: crates/firmware-promicro
        run: |
          for layout in layout-promicro-standard layout-promicro-classic; do
            cargo +nightly build --release --no-default-features --features "$layout"
            avr-objcopy -O ihex -R .eeprom \
              ../../target/avr-none/release/firmware-promicro.elf \
              "../../dist/mumen-promicro-${layout}.hex"
          done

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.hex > SHA256SUMS
          cat SHA256SUMS

      - name: Upload firmware release blobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mumen-firmware-hex
          if-no-files-found: error
          path: |
            dist/*.hex
            dist/SHA256SUMS

  release:
    name: Publish GitHub release
    needs:
      - zizmor
      - rust
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for gh release create/upload to publish firmware blobs
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download firmware release blobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mumen-firmware-hex
          path: dist

      - name: Publish tagged release or update rolling main release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            gh release create "$REF_NAME" \
              --verify-tag \
              --title "MumenController $REF_NAME" \
              --generate-notes \
              dist/*
          else
            SHORT_SHA="${SHA:0:7}"
            TAG="latest"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" \
                --target "$SHA" \
                --title "Latest main build ($SHORT_SHA)" \
                --notes "Automated firmware build from \`main\` commit \`$SHA\`." \
                --prerelease
            else
              gh release create "$TAG" \
                --target "$SHA" \
                --title "Latest main build ($SHORT_SHA)" \
                --notes "Automated firmware build from \`main\` commit \`$SHA\`." \
                --prerelease \
                dist/*
            fi
          fi
